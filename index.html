<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Internal Audit — PT Perintis Perkasa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--line:#E1E5EA;--ink:#171B21;--ink-dim:#5B6472;--ink-faint:#8A93A1;--accent2:#6D28D9;--b4:#DC2626;
    --serif:'Fraunces',Georgia,serif;--sans:'Inter','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;background:#fff;color:var(--ink);font-family:var(--sans);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  #app[hidden]{display:none}
  #app{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
  .tabbar{flex:0 0 auto;display:flex;gap:4px;align-items:flex-end;padding:8px 16px 0;background:#f5f6f8;border-bottom:1px solid #e4e8ee;overflow-x:auto}
  .tab{font:inherit;font-size:14px;font-weight:600;color:#6b7684;background:transparent;border:1px solid transparent;border-bottom:none;border-radius:10px 10px 0 0;padding:10px 18px;cursor:pointer;white-space:nowrap;position:relative;top:1px}
  .tab:hover{color:#151a22}
  .tab[aria-selected="true"]{color:var(--accent2);background:#fff;border-color:#e4e8ee}
  .tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent2);border-radius:10px 10px 0 0}
  .panels{flex:1 1 auto;position:relative;min-height:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  iframe[hidden]{display:none}
  .loading{position:absolute;inset:0;display:grid;place-items:center;color:#6b7684;font-size:14px;pointer-events:none}
  .pw-gate { position: fixed; inset: 0; background: #F5F3FA; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .pw-gate.hidden { display: none; }
  .pw-box { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 40px 36px 36px; width: 100%; max-width: 380px; box-shadow: 0 10px 40px rgba(60,40,120,.10); text-align: center; }
  .pw-co { font-size: 13px; color: var(--ink-dim); margin-bottom: 10px; }
  .pw-title { font-family: var(--serif); font-size: 28px; font-weight: 600; margin-bottom: 26px; color: var(--ink); line-height: 1.2; }
  .pw-sub { font-size: 14px; color: var(--ink-dim); margin-bottom: 24px; line-height: 1.5; }
  .pw-field { position: relative; margin-bottom: 12px; }
  .pw-field input { margin-bottom: 0 !important; padding-right: 48px !important; }
  .pw-eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 40px !important; height: 40px; padding: 0 !important; background: none !important; border: none !important; color: var(--ink-faint) !important; border-radius: 10px !important; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .pw-eye:hover { color: var(--accent2) !important; opacity: 1 !important; }
  #pwForm input { width: 100%; padding: 14px 16px; border: 1px solid var(--line); background: #F8FAFC; border-radius: 12px; font-size: 16px; margin-bottom: 12px; box-sizing: border-box; font-family: var(--sans); }
  #pwForm input:focus { outline: none; border: 2px solid var(--accent2); padding: 13px 15px; }
  #pwForm button { width: 100%; padding: 14px; background: var(--accent2); color: #fff; border: none; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; font-family: var(--sans); }
  #pwForm button:hover { opacity: .92; }
  .pw-error { color: var(--b4); font-size: 13px; margin-top: 14px; }
  .pw-error.hidden { display: none; }

</style>
</head>
<body>
<div id="passwordGate" class="pw-gate">
    <div class="pw-box">
      <div class="pw-co">PT Perintis Perkasa, Medan</div>
      <div class="pw-title">Divisi Unit</div>
      <form id="pwForm">
        <div class="pw-field">
          <input type="password" id="pwInput" placeholder="Password" autocomplete="current-password">
          <button type="button" id="pwToggle" class="pw-eye" aria-label="Tampilkan password" aria-pressed="false" title="Tampilkan / sembunyikan password">
            <svg id="pwEyeOn" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="pwEyeOff" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a19.9 19.9 0 0 1-3.17 4.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <button type="submit">Masuk</button>
      </form>
      <div id="pwError" class="pw-error hidden">Password salah, coba lagi.</div>
    </div>
  </div>
  
<div id="app" hidden>
  <div class="tabbar" role="tablist">
    <button class="tab" role="tab" id="t-piutang" data-tab="piutang" aria-selected="true">Dashboard Piutang</button>
    <button class="tab" role="tab" id="t-bpkb" data-tab="bpkb" aria-selected="false">BPKB Cash</button>
  </div>
  <div class="panels">
    <div class="loading" id="loading">Memuat…</div>
    <iframe id="f-piutang" title="Dashboard Piutang"></iframe>
    <iframe id="f-bpkb" title="BPKB Cash" hidden></iframe>
  </div>
</div>

  /* ---- password gate: status login hanya di memori, jadi setiap reload minta password lagi ---- */
  var gate=document.getElementById('passwordGate'), form=document.getElementById('pwForm'),
      input=document.getElementById('pwInput'), errorEl=document.getElementById('pwError'),
      toggle=document.getElementById('pwToggle'), eyeOn=document.getElementById('pwEyeOn'), eyeOff=document.getElementById('pwEyeOff');
  input.focus();
  toggle.addEventListener('click',function(){
    var show=input.type==='password';
    input.type=show?'text':'password';
    eyeOn.style.display=show?'none':''; eyeOff.style.display=show?'':'none';
    toggle.setAttribute('aria-pressed',show?'true':'false');
    toggle.setAttribute('aria-label',show?'Sembunyikan password':'Tampilkan password');
    input.focus();
  });
  form.addEventListener('submit',function(e){
    e.preventDefault();
    if(input.value===CORRECT_PASSWORD){
      input.value='';
      gate.classList.add('hidden');
      document.getElementById('app').hidden=false;
      var h=(location.hash||'').slice(1);
      show(h==='bpkb'?'bpkb':'piutang');
    } else {
      errorEl.classList.remove('hidden'); input.value=''; input.focus();
    }
  });

  /* ---- tabs ---- */
  function decode(b64){
    var bin=atob(b64),bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }
  function show(name){
    ['piutang','bpkb'].forEach(function(n){
      var on=n===name;
      document.getElementById('t-'+n).setAttribute('aria-selected',on);
      document.getElementById('f-'+n).hidden=!on;
    });
    var ld=document.getElementById('loading');
    if(!loaded[name]){
      loaded[name]=true;
      var f=document.getElementById('f-'+name);
      f.addEventListener('load',function(){ld.style.display='none'},{once:true});
      ld.style.display='grid';
      f.srcdoc=decode(SRC[name]);
    } else { ld.style.display='none'; }
    try{history.replaceState(null,'','#'+name)}catch(e){}
  }
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click',function(){show(t.dataset.tab)});
  });
})();
